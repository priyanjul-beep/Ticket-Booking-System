version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticket-booking-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketbooking}
      POSTGRES_USER: ${POSTGRES_USER:-tbuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tbpassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tbuser} -d ${POSTGRES_DB:-ticketbooking}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticket-network

  redis:
    image: redis:7.2-alpine
    container_name: ticket-booking-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticket-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket-booking-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ticketbooking}
      POSTGRES_USER: ${POSTGRES_USER:-tbuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tbpassword}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ticket-network

volumes:
  postgres_data:
  redis_data:

networks:
  ticket-network:
    driver: bridge
