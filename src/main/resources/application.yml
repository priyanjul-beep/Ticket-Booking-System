spring:
  application:
    name: ticket-booking-system

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ticketbooking}
    username: ${POSTGRES_USER:tbuser}
    password: ${POSTGRES_PASSWORD:tbpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: TicketBookingHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redispassword}
      timeout: 2000ms
      connect-timeout: 2000ms

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true

logging:
  level:
    com.ticketbooking: INFO
    org.springframework.transaction: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"

# Application-specific config
app:
  booking:
    expiry-minutes: ${BOOKING_EXPIRY_MINUTES:5}
  lock:
    wait-seconds: ${LOCK_WAIT_SECONDS:5}
    lease-seconds: ${LOCK_LEASE_SECONDS:10}
  redis:
    lock-prefix: "lock:seat:"
    idempotency-ttl-seconds: 86400   # 24 hours

---
spring:
  config:
    activate:
      on-profile: docker
  jpa:
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: 30

logging:
  level:
    com.ticketbooking: INFO

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    hikari:
      maximum-pool-size: 10
  jpa:
    show-sql: false
  flyway:
    enabled: true
